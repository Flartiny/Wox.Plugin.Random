name: Release Wox plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Verify release tag
        run: uv run python -c "import json, os, sys; expected = 'v' + json.load(open('plugin.json', encoding='utf-8'))['Version']; actual = os.environ['GITHUB_REF_NAME']; sys.exit(0 if actual == expected else f'Expected tag {expected}, received {actual}')"

      - name: Test
        run: uv run pytest

      - name: Package plugin
        run: uv run python package.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: wox.plugin.Random.wox
